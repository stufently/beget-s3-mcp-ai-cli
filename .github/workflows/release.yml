name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Release binaries in Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.cache/sel-s3-go"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod -e GITHUB_TOKEN -v "$HOME/.cache/sel-s3-go:/cache" -v "$PWD:/src" -w /src goreleaser/goreleaser:v2.18.3 release --clean
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "BUILD_UID=$(id -u)" --build-arg "BUILD_GID=$(id -g)" --build-arg "VERSION=${TAG#v}" --build-arg "COMMIT=$COMMIT" -t "ghcr.io/$OWNER/beget-s3-mcp-ai-cli:${TAG#v}" --push .
